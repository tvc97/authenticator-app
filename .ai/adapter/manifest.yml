# Project facts. Claude READS this and never guesses these values.
# Anything marked pending-discovery must be filled by ./.ai/adapter/setup or a human.

platform: ios-swiftui

project:
  status: ready
  kind: xcodeproj
  path: authenticator.xcodeproj
  scheme: authenticator
  test_scheme: authenticator
  bundle_id: "co.alley51.authenticator"
  team_id: "HA7PT38WRU"

toolchain:
  xcode: "27.0"
  swift: "6.4"
  min_ios: "26.0"
  strict_concurrency: complete

simulator:
  name: "iPhone 18 Pro"
  runtime: "iOS 27.0"

device:
  name: "iPhone 18 Pro" # fill with the primary development iPhone
  min_supported: "18" # oldest device kept for verification

tiers:
  - static
  - unit
  - integration
  - security
  - runtime

# Change classes that CANNOT be verified on the simulator.
# Touching any of these forces runtime.target = device.
device_required_for:
  - keychain-accessibility
  - secure-enclave
  - biometrics
  - icloud-keychain-sync
  - autofill-extension
  - camera-qr-scan
  - watch-companion
  - background-time-drift
  - entitlements
  - push-notifications

# Paths an agent may NEVER change. `scope-check` fails hard and `pre-tool-safety.sh`
# blocks the edit outright. These stay human-only because the agent physically cannot
# satisfy them -- not because the change is merely risky.
human_paths:
  - "**/*.entitlements"
  - "**/Info.plist"

# High blast radius. An agent MAY change these, but the change is not complete until a cold
# `reviewer` subagent records APPROVE in .ai/run/<issue>/review.yml AND the security tier
# is PASS. This replaces the old "stop and ask a human" gate with a check that produces
# evidence instead of a wait. See ADR-002.
review_paths:
  - "**/Crypto/**"
  - "**/Keychain/**"
  - "**/Backup/**"
  - ".claude/hooks/**"
  - ".claude/settings.json"
  - ".ai/adapter/**"
  - "scripts/ai/**"

artifacts:
  dir: build
