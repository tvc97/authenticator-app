# Project facts. Claude READS this and never guesses these values.
# Anything marked pending-discovery must be filled by ./.ai/adapter/setup or a human.

platform: ios-swiftui

project:
  status: ready
  kind: xcodeproj
  path: authenticator.xcodeproj
  scheme: authenticator
  test_scheme: authenticator
  bundle_id: "co.alley51.authenticator"
  team_id: "HA7PT38WRU"

toolchain:
  xcode: "27.0"
  swift: "6.4"
  min_ios: "26.0"
  strict_concurrency: complete

simulator:
  name: "iPhone 18 Pro"
  runtime: "iOS 27.0"

device:
  name: "iPhone 18 Pro" # fill with the primary development iPhone
  min_supported: "18" # oldest device kept for verification

tiers:
  - static
  - unit
  - integration
  - security
  - runtime

# Change classes that CANNOT be verified on the simulator.
# Touching any of these forces runtime.target = device.
device_required_for:
  - keychain-accessibility
  - secure-enclave
  - biometrics
  - icloud-keychain-sync
  - autofill-extension
  - camera-qr-scan
  - watch-companion
  - background-time-drift
  - entitlements
  - push-notifications

# Source markers that force a device run even when the issue was never labelled
# device-required. The label is a sentence someone remembered to write; a marker in the
# diff is observable. Matched case-sensitively against added/removed lines.
device_required_markers:
  - "kSecAttrAccessible"
  - "kSecAttrSynchronizable"
  - "SecAccessControl"
  - "LAContext"
  - "LocalAuthentication"
  - "AVCaptureDevice"
  - "ASCredentialProvider"
  - "WCSession"
  - "com.apple.developer"
  - "BGTaskScheduler"

# Paths an agent may NEVER change. `scope-check` fails hard; `pre-tool-safety.sh` and the
# settings deny list block the edit outright. The test is not "is this risky" -- it is
# "can an agent satisfy this at all". If the tooling blocks it, it belongs here, otherwise
# the manifest invites an edit the tooling refuses, which is an invitation to route around
# the deny list.
human_paths:
  - "**/*.entitlements"
  - "**/Info.plist"
  - ".claude/hooks/**"
  - ".claude/settings.json"

# High blast radius. An agent MAY change these, but the change is not complete until a cold
# `reviewer` subagent records APPROVE in .ai/run/<issue>/review.yml AND the security tier
# is PASS. This replaces the old "stop and ask a human" gate with a check that produces
# evidence instead of a wait. See ADR-002.
review_paths:
  - "**/Crypto/**"
  - "**/Keychain/**"
  - "**/Backup/**"
  - ".ai/adapter/**"
  - "scripts/ai/**"
  - ".github/**"

artifacts:
  dir: build
